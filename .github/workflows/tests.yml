name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1 xvfb dbus-x11 desktop-file-utils
      - name: Unit and installer tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validate desktop launcher
        run: desktop-file-validate data/io.github.signalrail.Bluetooth.desktop
      - name: Native UI without layer shell
        run: xvfb-run -a dbus-run-session -- env GDK_BACKEND=x11 SIGNAL_RAIL_DISABLE_LAYER_SHELL=1 /usr/bin/python3 tests/native_smoke.py --window
      - name: Standalone status exits
        run: timeout 15 xvfb-run -a dbus-run-session -- env GDK_BACKEND=x11 /usr/bin/python3 signal_rail.py --demo --window --status
